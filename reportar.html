<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Reportar un evento</title>
<style>
:root{--az:#0b3d91;--az2:#1565c0;--na:#f28c28;--ve:#2e7d32;--ro:#c62828;--am:#f9a825;--gr:#eef2f8;--bo:#c9d3e3;--tx:#1a1a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f4f6fb;color:var(--tx);font-family:Arial,Helvetica,sans-serif;font-size:18px}
header{background:linear-gradient(90deg,var(--az),var(--az2));color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header b{font-size:17px;display:block}header small{opacity:.9;font-size:13px}
.prog{height:8px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--na);width:0;transition:width .3s}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:24px;line-height:1.25;margin:6px 0 6px;color:var(--az)}
.sub{color:#4a5870;font-size:16px;margin:0 0 16px;line-height:1.4}
.op{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:3px solid var(--bo);border-radius:16px;
  padding:16px;margin:0 0 12px;font-size:19px;font-weight:bold;color:var(--tx);cursor:pointer;font-family:inherit;line-height:1.25}
.op .ic{font-size:34px;flex:none;width:44px;text-align:center}
.op small{display:block;font-weight:normal;font-size:14px;color:#5a6780;margin-top:3px}
.op.on{border-color:var(--az);background:#e3ecfb}
.op.ro{border-color:#ef9a9a}.op.ro.on{border-color:var(--ro);background:#fdecea}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.chip{border:3px solid var(--bo);background:#fff;border-radius:30px;padding:12px 18px;font-size:17px;cursor:pointer;user-select:none;font-family:inherit;color:var(--tx)}
.chip.on{background:var(--az);border-color:var(--az);color:#fff;font-weight:bold}
.grupo{font-size:15px;font-weight:bold;color:var(--az);margin:14px 0 8px}
input,textarea,select{width:100%;padding:14px;border:3px solid var(--bo);border-radius:12px;font-size:19px;font-family:inherit;background:#fff}
input:focus,textarea:focus{outline:none;border-color:var(--az2)}
textarea{min-height:170px;resize:vertical;line-height:1.4}
label.l{display:block;font-weight:bold;font-size:16px;color:#33435c;margin:14px 0 6px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.12);padding:12px 16px;display:flex;gap:10px;z-index:6}
.nav button{flex:1;border:0;border-radius:14px;padding:16px;font-size:19px;font-weight:bold;cursor:pointer;font-family:inherit}
.btnAtras{background:#e0e4ec;color:#33435c;flex:0 0 34%!important}
.btnSig{background:var(--ve);color:#fff}
.btnSig:disabled{background:#9bbf9d}
.caja{border-radius:14px;padding:14px;margin:0 0 14px;font-size:16px;line-height:1.45}
.caja.info{background:#e3f0ff;border-left:7px solid var(--az2);color:#0b3d91}
.caja.ro{background:#fdecea;border-left:7px solid var(--ro);color:#8e0000}
.caja.ok{background:#e8f5e9;border-left:7px solid var(--ve);color:#1b5e20}
.caja.am{background:#fff8e1;border-left:7px solid var(--am);color:#6d4c00}
.caja ol,.caja ul{margin:6px 0 0;padding-left:22px}.caja li{margin:4px 0}
.eva{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.eva button{border:3px solid transparent;border-radius:12px;padding:10px 0;font-size:22px;font-weight:bold;cursor:pointer;font-family:inherit}
.eva button span{display:block;font-size:24px}
.eva button.on{border-color:#000;transform:scale(1.08)}
.firma{width:100%;height:200px;border:3px dashed #9aa7bd;border-radius:14px;background:#fff;touch-action:none;display:block}
.fila{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.borrar{background:#ffcdd2;color:#8e0000;border:0;border-radius:10px;padding:8px 14px;font-weight:bold;font-size:15px;cursor:pointer}
.res{background:#fff;border-radius:14px;padding:4px 14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.res div{padding:10px 0;border-bottom:1px solid #e3e7ef;font-size:16px}.res div:last-child{border:0}
.res b{display:block;font-size:13px;color:#5a6780;text-transform:uppercase}
.check{display:flex;gap:12px;align-items:flex-start;font-size:17px;background:#fff;border-radius:14px;padding:14px;border:3px solid var(--bo);margin:12px 0}
.check input{width:28px;height:28px;flex:none;margin:0}
.yo{background:#fff;border-radius:16px;padding:18px;border:3px solid var(--az);text-align:center;margin-bottom:12px}
.yo .nom{font-size:24px;font-weight:bold;color:var(--az)}.yo small{display:block;color:#5a6780;font-size:16px;margin-top:6px}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.fotos img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:2px solid var(--bo)}
.mic{background:var(--na);color:#fff;border:0;border-radius:30px;padding:10px 16px;font-size:16px;font-weight:bold;cursor:pointer;margin:8px 0}
.mic.on{background:var(--ro)}
.grande{font-size:64px;text-align:center;margin:10px 0}
.link{color:var(--az2);font-weight:bold;background:none;border:0;font-size:17px;text-decoration:underline;cursor:pointer;padding:8px 0;font-family:inherit}
.spin{text-align:center;padding:40px 0;font-size:18px;color:#5a6780}
.hide{display:none!important}
</style>
</head>
<body>
<header><b id="hTit">Reportar un evento de seguridad</b><small id="hSub">Cargando...</small><div class="prog"><i id="prog"></i></div></header>
<main id="m"><div class="spin">Cargando...</div></main>
<div class="nav hide" id="nav"><button class="btnAtras" id="bAtras" onclick="atras()">◀ Atrás</button><button class="btnSig" id="bSig" onclick="siguiente()">Siguiente ▶</button></div>

<script>
/* Puente: fuera de Google (GitHub) usa la API del servidor sin sesión de Chrome */
(function(){
  if(window.google&&google.script&&google.script.run)return;
  var API='https://script.google.com/macros/s/AKfycbyFetoPIT053n1kiihmhFB5XhUF9sti1t96umwnhKn2rIe2oseukyDzn1EZCLtHV7Qx/exec';
  function runner(ok,ko){return new Proxy({},{get:function(_,fn){
    if(fn==='withSuccessHandler')return function(h){return runner(h,ko)};
    if(fn==='withFailureHandler')return function(h){return runner(ok,h)};
    return function(){var args=Array.prototype.slice.call(arguments);
      fetch(API,{method:'POST',credentials:'omit',redirect:'follow',body:JSON.stringify({fn:fn,args:args})})
        .then(function(r){return r.json()})
        .then(function(j){if(j.ok){ok&&ok(j.r)}else{ko&&ko(new Error(j.e))}})
        .catch(function(e){ko&&ko(new Error('No hay conexión. Revisa tu internet e intenta de nuevo.'))});
    }}})}
  window.google={script:{get run(){return runner(null,null)}}};
})();
</script>
<script>
// ================== DATOS ==================
var INFO={cliente:'',oal:'tu mutualidad',fonoOal:'',inscripcion:'',lugares:[],actividades:[]};
var R={}, YO=null, PILA=[], ACT='inicio', FIRMA=null, ENVIANDO=false, SES='', SESNOM='';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function cred(){try{return JSON.parse(ls('rep_cred')||'null')}catch(e){return null}}
var T_ACC='Accidente del trabajo',T_TRA='Accidente de trayecto',T_INC='Incidente / cuasi accidente',T_DAN='Daño material',T_EP='Posible enfermedad profesional',T_LK='Ley Karin';
var TIPOS=[
  {t:T_ACC,ic:'🤕',tx:'Me accidenté trabajando',d:'Me golpeé, me corté, me caí, me torcí, etc.'},
  {t:T_TRA,ic:'🚌',tx:'Me accidenté en el camino',d:'De la casa al trabajo o del trabajo a la casa'},
  {t:T_INC,ic:'⚠️',tx:'Casi ocurre un accidente',d:'Nadie se lesionó, pero pudo pasar algo'},
  {t:T_DAN,ic:'💥',tx:'Se dañó un equipo o material',d:'Grúa, camión, rack, producto, instalación'},
  {t:T_EP,ic:'🩺',tx:'Tengo una molestia por mi trabajo',d:'Dolor o malestar que viene de hace un tiempo'},
  {t:T_LK,ic:'🛑',tx:'Sufrí acoso, maltrato o violencia',d:'Ley Karin. Es reservado: solo lo ve prevención',ro:1}];
var PARTES={'Cabeza':['Cabeza','Cara','Ojo der.','Ojo izq.','Oreja der.','Oreja izq.','Boca / dientes','Cuello'],
  'Tronco':['Hombro der.','Hombro izq.','Pecho','Espalda alta','Espalda baja (lumbar)','Abdomen','Cadera der.','Cadera izq.'],
  'Brazos y manos':['Brazo der.','Brazo izq.','Codo der.','Codo izq.','Muñeca der.','Muñeca izq.','Mano der.','Mano izq.','Dedos mano der.','Dedos mano izq.'],
  'Piernas y pies':['Pierna der.','Pierna izq.','Rodilla der.','Rodilla izq.','Tobillo der.','Tobillo izq.','Pie der.','Pie izq.','Dedos pie der.','Dedos pie izq.']};
var EVA=[['😀','#1b9e3e'],['🙂','#5cb85c'],['🙂','#8bc34a'],['😐','#cddc39'],['😐','#ffeb3b'],['😕','#ffc107'],['😟','#ff9800'],['😣','#ff7043'],['😖','#f4511e'],['😫','#e53935'],['😭','#b71c1c']];

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function has(t){return (R.tipos||[]).indexOf(t)>-1}
function acc(){return has(T_ACC)||has(T_TRA)}
function lesion(){return acc()||has(T_EP)}
function lk(){return has(T_LK)}
function hoyISO(o){var h=new Date();h.setDate(h.getDate()-(o||0));return new Date(h-h.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function dma(iso){var p=String(iso||'').split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:iso}

// ================== COMPONENTES ==================
function opciones(campo,lista,multi){ // lista: [{v,ic,tx,d,ro}]
  return lista.map(function(o){var on=multi?(R[campo]||[]).indexOf(o.v)>-1:R[campo]===o.v;
    return '<button class="op'+(o.ro?' ro':'')+(on?' on':'')+'" onclick="elige(\''+campo+'\',\''+esc(o.v).replace(/'/g,"\\'")+'\','+(multi?1:0)+')">'+
      (o.ic?'<span class="ic">'+o.ic+'</span>':'')+'<span>'+esc(o.tx||o.v)+(o.d?'<small>'+esc(o.d)+'</small>':'')+'</span></button>'}).join('');
}
function chips(campo,lista,multi){
  return '<div class="chips">'+lista.map(function(v){var on=multi?(R[campo]||[]).indexOf(v)>-1:R[campo]===v;
    return '<button class="chip'+(on?' on':'')+'" onclick="elige(\''+campo+'\',\''+esc(v).replace(/'/g,"\\'")+'\','+(multi?1:0)+')">'+esc(v)+'</button>'}).join('')+'</div>';
}
function sino(campo){return chips(campo,['SI','NO'])}
function elige(campo,v,multi){
  if(multi){var a=R[campo]=R[campo]||[],i=a.indexOf(v);if(i>-1)a.splice(i,1);else a.push(v)}
  else R[campo]=R[campo]===v?'':v;
  var y=window.scrollY;pintar();window.scrollTo(0,y);
  var p=PASOS[ACT];if(!multi&&p.auto&&R[campo]&&valido(true))setTimeout(siguiente,250);
}
function campo(id,ph,tipo,extra){return '<input id="'+id+'" type="'+(tipo||'text')+'" placeholder="'+esc(ph||'')+'" value="'+esc(R[id]||'')+'" oninput="R.'+id+'=this.value;botones()" '+(extra||'')+'>'}
function texto(id,ph){return '<textarea id="'+id+'" placeholder="'+esc(ph||'')+'" oninput="R.'+id+'=this.value;botones()">'+esc(R[id]||'')+'</textarea>'+mic(id)}
function mic(id){var ok=window.SpeechRecognition||window.webkitSpeechRecognition;return ok?'<button class="mic" id="mic_'+id+'" onclick="dictar(\''+id+'\')">🎤 Hablar en vez de escribir</button>':''}
var REC=null;
function dictar(id){
  var S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return;
  if(REC){REC.stop();REC=null;return}
  REC=new S();REC.lang='es-CL';REC.continuous=true;REC.interimResults=false;
  var b=$('mic_'+id);b.classList.add('on');b.textContent='⏹ Detener (te estoy escuchando...)';
  REC.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){var t=$(id);t.value=(t.value?t.value.replace(/\s*$/,' '):'')+e.results[i][0].transcript;R[id]=t.value}botones()};
  REC.onend=function(){REC=null;if($('mic_'+id)){$('mic_'+id).classList.remove('on');$('mic_'+id).textContent='🎤 Hablar en vez de escribir'}};
  try{REC.start()}catch(e){REC=null}
}
function caja(c,h){return '<div class="caja '+c+'">'+h+'</div>'}
function titulo(t,s){return '<h1>'+t+'</h1>'+(s?'<p class="sub">'+s+'</p>':'')}

// ================== PASOS ==================
// cada paso: ver() -> ¿se muestra?, html() -> contenido, ok() -> ¿puede avanzar? (true o mensaje), auto: avanza solo al elegir
var PASOS={
 inicio:{nav:0,html:function(){return '<div class="grande">🦺</div>'+titulo('Reporta lo que pasó','Te haremos unas preguntas cortas, una por una. Toma unos 3 a 5 minutos.')+
   caja('info','<b>¿Por qué reportar?</b><ul><li>Para que te atiendan y quede todo registrado.</li><li>Para que se investigue la causa y no le pase a otro compañero.</li><li>La empresa debe registrar e investigar los accidentes e incidentes (DS 44).</li></ul>')+
   '<button class="op on" onclick="siguiente()"><span class="ic">▶</span><span>Comenzar</span></button>'}},

 rut:{html:function(){
   var porNombre=R._modo==='nombre';var c=cred();if(R.q===undefined&&c&&!porNombre)R.q=c.q;
   return titulo(porNombre?'Escribe tu nombre y apellido':'Escribe tu RUT', porNombre?'Como aparece en tu carnet. Ejemplo: Juan Pérez Soto':'Sin puntos, con guion o sin guion. Ejemplo: 12345678-9')+
     (porNombre?campo('q','Nombre y apellido','text','autocomplete="off"'):campo('q','RUT','text','autocomplete="off" inputmode="text" autocapitalize="characters"'))+
     '<p><button class="link" onclick="R._modo=\''+(porNombre?'rut':'nombre')+'\';R.q=\'\';pintar()">'+(porNombre?'Prefiero usar mi RUT':'No me acuerdo de mi RUT: buscar por nombre')+'</button></p>'+
     (R._err?caja('ro',R._err):'');
 },ok:function(){return (R.q||'').trim().length>=3||'Escribe tu '+(R._modo==='nombre'?'nombre':'RUT')},sig:'Buscarme',accion:buscar},

 noinscrito:{ver:function(){return false},nav:0,html:function(){
   return '<div class="grande">📋</div>'+titulo('No estás en la nómina','Para reportar, primero tienes que estar inscrito como trabajador de la empresa.')+
     caja('am','<b>¿Qué hago?</b><ol><li>Avisa ahora a tu jefatura lo que pasó (en persona o por teléfono).</li><li>Pídele que te inscriba en el <b>Formulario de Inscripción</b>.</li><li>Después vuelve a esta página.</li></ol>')+
     (INFO.inscripcion?'<a class="op on" style="text-decoration:none" href="'+esc(INFO.inscripcion)+'" target="_blank"><span class="ic">📝</span><span>Abrir Formulario de Inscripción</span></a>':'')+
     caja('ro','Si estás herido, <b>no esperes</b>: avisa a tu jefatura y atiéndete en '+esc(INFO.oal)+(INFO.fonoOal?' (fono '+esc(INFO.fonoOal)+')':'')+'. Si es grave llama al <b>131</b> (SAMU).')+
     '<button class="op" onclick="R.q=\'\';ir(\'rut\')"><span class="ic">↩</span><span>Intentar de nuevo</span></button>';
 }},

 confirma:{html:function(){
   var c=R._cand||[];
   if(c.length===1){var w=c[0];return titulo('¿Eres tú?')+'<div class="yo"><div class="nom">'+esc(w.nombre)+'</div><small>'+esc(w.cargo)+'<br>'+esc(w.sucursal)+' · '+esc(w.empresa)+'</small><small>RUT '+esc(w.run)+'</small></div>'+
     '<button class="op on" onclick="soyYo(0)"><span class="ic">✅</span><span>Sí, soy yo</span></button><button class="op" onclick="R.q=\'\';ir(\'rut\')"><span class="ic">❌</span><span>No soy yo</span></button>'}
   return titulo('¿Cuál eres tú?','Toca tu nombre')+c.map(function(w,i){return '<button class="op" onclick="soyYo('+i+')"><span class="ic">👤</span><span>'+esc(w.nombre)+'<small>'+esc(w.cargo)+' · '+esc(w.sucursal)+' · RUT '+esc(w.run)+'</small></span></button>'}).join('')+
     '<button class="op" onclick="R.q=\'\';ir(\'rut\')"><span class="ic">❌</span><span>No aparezco</span></button>';
 },nav:0},

 clave:{ver:function(){return false},html:function(){
   var c=cred();if(R.clave===undefined&&c&&c.k===YO.nombre)R.clave=c.c;
   return titulo('Escribe tu clave','Tu <b>primer nombre</b> + tu <b>año de nacimiento</b>, todo junto y sin espacios.')+
     caja('info','Ejemplo: si te llamas <b>Juan</b> Pérez y naciste en <b>1985</b>, tu clave es <b>juan1985</b>')+
     '<input id="clave" type="'+(R._ver?'text':'password')+'" placeholder="Ej: juan1985" value="'+esc(R.clave||'')+'" oninput="R.clave=this.value;botones()" autocomplete="off" autocapitalize="none">'+
     '<label class="check"><input type="checkbox" '+(R._ver?'checked':'')+' onchange="R._ver=this.checked;pintar()"> Ver clave</label>'+
     '<label class="check"><input type="checkbox" id="recordar" '+(R._rec!==false?'checked':'')+' onchange="R._rec=this.checked"> Recordar mi RUT y clave en este celular</label>'+
     (R._err?caja('ro',R._err):'');
 },ok:function(){return (R.clave||'').trim().length>=5||'Escribe tu clave'},sig:'Entrar',accion:revisarClave},

 tipo:{html:function(){return titulo('Hola '+esc(YO.saludo)+' 👋 ¿Qué quieres reportar?','Elige la opción que más se parece. Después puedes agregar otra.')+
   TIPOS.map(function(o){var on=R.tipo===o.t;return '<button class="op'+(o.ro?' ro':'')+(on?' on':'')+'" onclick="eligeTipo(\''+o.t+'\')"><span class="ic">'+o.ic+'</span><span>'+o.tx+'<small>'+o.d+'</small></span></button>'}).join('')},
   ok:function(){return !!R.tipo||'Elige una opción'}},

 extra:{ver:function(){return !lk()},html:function(){
   var l=TIPOS.filter(function(o){return o.t!==R.tipo&&o.t!==T_LK&&!(R.tipo===T_ACC&&o.t===T_TRA)&&!(R.tipo===T_TRA&&o.t===T_ACC)})
     .map(function(o){return {v:o.t,ic:o.ic,tx:o.tx}});
   return titulo('¿Además pasó algo de esto?','Si no, toca <b>Siguiente</b>.')+opciones('extras',l,1)}},

 urgente:{ver:function(){return acc()},auto:1,html:function(){
   return titulo('¿Estás herido o necesitas atención ahora?')+opciones('urgente',[{v:'SI',ic:'🚑',tx:'Sí, necesito atención',ro:1},{v:'NO',ic:'👍',tx:'No, estoy bien por ahora'}])+
     (R.urgente==='SI'?caja('ro','<b>Haz esto primero:</b><ol><li>Avisa <b>ahora</b> a tu jefatura.</li><li>Atiéndete en '+esc(INFO.oal)+(INFO.fonoOal?' — fono <b>'+esc(INFO.fonoOal)+'</b>':'')+'.</li><li>Si es grave (sangrado fuerte, pérdida de conciencia, no puedes moverte): llama al <b>131</b> (SAMU).</li></ol>Puedes terminar este reporte después de atenderte.'):'');
 },ok:function(){return !!R.urgente||'Elige una opción'}},

 cuando:{auto:1,html:function(){
   return titulo(lk()?'¿Cuándo pasó la última vez?':'¿Cuándo pasó?')+opciones('dia',[{v:'hoy',ic:'📅',tx:'Hoy'},{v:'ayer',ic:'⏪',tx:'Ayer'},{v:'otro',ic:'🗓️',tx:'Otro día'}])+
     (R.dia==='otro'?'<label class="l">Elige la fecha</label><input type="date" id="fechaOtra" max="'+hoyISO()+'" value="'+esc(R.fechaOtra||'')+'" onchange="R.fechaOtra=this.value;botones()">':'');
 },ok:function(){return R.dia==='hoy'||R.dia==='ayer'||(R.dia==='otro'&&!!R.fechaOtra)||'Indica el día'}},

 hora:{ver:function(){return !has(T_EP)||R.tipo!==T_EP},auto:1,html:function(){
   return titulo('¿A qué hora, más o menos?')+opciones('momento',[{v:'En la mañana',ic:'🌅',tx:'En la mañana'},{v:'En la tarde',ic:'☀️',tx:'En la tarde'},{v:'En la noche',ic:'🌙',tx:'En la noche'}])+
     '<label class="l">Si sabes la hora exacta (opcional)</label>'+campo('horaExacta','','time');
 },ok:function(){return !!(R.momento||R.horaExacta)||'Elige una opción'}},

 tray1:{ver:function(){return has(T_TRA)},auto:1,html:function(){return titulo('¿Hacia dónde ibas?')+
   opciones('trayectoSentido',[{v:'Casa → Trabajo',ic:'🏠',tx:'De mi casa al trabajo'},{v:'Trabajo → Casa',ic:'🏢',tx:'Del trabajo a mi casa'},{v:'Entre dos trabajos',ic:'🔁',tx:'Entre dos trabajos'}])},

var ORDEN=['inicio','rut','confirma','tipo','extra','urgente','cuando','hora','tray1','tray2','tray3','donde','actividad','forma','incidente','dano','ep1','ep2','lk1','lk2',
  'relato','partes','tipoLesion','eva','atencion','lk3','testigos','fotos','sugerencia','resumen'];

// ================== MOTOR ==================
function visible(id){var p=PASOS[id];return !p.ver||p.ver()}
function pintar(){
  var p=PASOS[ACT];
  $('m').innerHTML=p.html();
  var nav=p.nav!==0;$('nav').classList.toggle('hide',!nav);
  if(p.despues)p.despues();
  var vis=ORDEN.filter(visible),i=vis.indexOf(ACT);
  $('prog').style.width=(ACT==='fin'?100:Math.max(3,Math.round((i<0?0:i)/(vis.length-1)*100)))+'%';
  botones();
}
function valido(silencio){var p=PASOS[ACT];if(!p.ok)return true;var r=p.ok();return r===true}
function botones(){
  var p=PASOS[ACT];
  $('bSig').textContent=ENVIANDO?'Enviando...':(p.sig||'Siguiente ▶');
  $('bSig').disabled=ENVIANDO;
  $('bAtras').style.visibility=PILA.length?'visible':'hidden';
}
function siguiente(){
  if(REC){REC.stop();REC=null}
  var p=PASOS[ACT];
  if(p.ok){var r=p.ok();if(r!==true){aviso(r);return}}
  if(p.accion){p.accion();return}
  var i=ORDEN.indexOf(ACT);
  for(var j=i+1;j<ORDEN.length;j++)if(visible(ORDEN[j])){ir(ORDEN[j]);return}
}
function ir(id,sinPila){if(!sinPila&&ACT!==id&&ACT!=='noinscrito')PILA.push(ACT);ACT=id;R._err='';pintar();window.scrollTo(0,0)}
function atras(){if(REC){REC.stop();REC=null}if(!PILA.length)return;ACT=PILA.pop();pintar();window.scrollTo(0,0)}
function aviso(t){var d=document.createElement('div');d.className='caja ro';d.style.cssText='position:fixed;left:12px;right:12px;top:96px;z-index:9;box-shadow:0 2px 10px rgba(0,0,0,.25)';d.innerHTML='⚠ '+t;document.body.appendChild(d);setTimeout(function(){d.remove()},3000)}

function eligeTipo(t){R.tipo=t;R.extras=(R.extras||[]).filter(function(x){return x!==t});actualizaTipos();pintar();setTimeout(siguiente,250)}
function actualizaTipos(){var t=R.tipo;R.tipos=t===T_LK?[T_LK]:[t].concat(R.extras||[])}
// recalcula los tipos cada vez que se marcan extras
var _elige=elige;elige=function(c,v,m){_elige(c,v,m);if(c==='extras'){actualizaTipos()}};

function fechaISO(){return R.dia==='ayer'?hoyISO(1):R.dia==='otro'?R.fechaOtra:hoyISO()}

// ---- Identificación ----
function buscar(){
  ENVIANDO=true;botones();
  google.script.run.withSuccessHandler(function(r){
    ENVIANDO=false;
    if(r.error==='NO_INSCRITO'){ir('noinscrito');return}
    if(r.error==='INACTIVO'){R._err='Hola '+esc(r.nombre)+', apareces como <b>INACTIVO</b> en la nómina. Avisa a tu jefatura para que actualice tu inscripción.';pintar();return}
    if(r.error){R._err=esc(r.msg);pintar();return}
    R._cand=r.candidatos;ir('confirma');
  }).withFailureHandler(function(e){ENVIANDO=false;R._err=esc(e.message);pintar()}).identificar(R.q);
}
function soyYo(i){YO=R._cand[i];R.k=YO.k;$('hSub').textContent=YO.nombre+' · '+YO.sucursal+(SES?' · por '+SESNOM:'');
  if(SES){PILA=[];ir('tipo',true)}else ir('clave')}
function revisarClave(){
  ENVIANDO=true;botones();
  google.script.run.withSuccessHandler(function(r){
    ENVIANDO=false;
    if(!r.ok){R._err='Clave incorrecta. '+(r.quedan>0?'Te quedan '+r.quedan+' intento(s).':'')+'<br>Recuerda: primer nombre + año de nacimiento (ej: juan1985).';pintar();return}
    var rec=$('recordar')&&$('recordar').checked;
    if(rec)ls('rep_cred',JSON.stringify({q:R._modo==='nombre'?'':R.q,k:YO.nombre,c:R.clave}));else ls('rep_cred',null);
    PILA=[];ir('tipo',true);
  }).withFailureHandler(function(e){ENVIANDO=false;R._err=esc(e.message);pintar()}).verificarClave(R.k,R.clave);
}

// ---- Fotos ----
function fotos(inp){
  Array.prototype.forEach.call(inp.files,function(f){
    if((R.fotos||[]).length>=6)return;
    var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){
      var max=1280,w=img.width,h=img.height;if(w>max||h>max){var k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
      var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      R.fotos.push(c.toDataURL('image/jpeg',0.72).split(',')[1]);pintar();
    };img.src=rd.result};rd.readAsDataURL(f);
  });
}

// ---- Firma ----
function pad(id){
  var c=$(id),x=c.getContext('2d'),dib=false,usado=false,r=c.getBoundingClientRect(),k=window.devicePixelRatio||1;
  c.width=Math.round(r.width*k);c.height=Math.round(r.height*k);x.scale(k,k);x.lineWidth=2.6;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0b2a66';
  function pos(e){var b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]}
  c.addEventListener('pointerdown',function(e){e.preventDefault();dib=true;usado=true;try{c.setPointerCapture(e.pointerId)}catch(_){}var p=pos(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]+.1);x.stroke()});
  c.addEventListener('pointermove',function(e){if(!dib)return;e.preventDefault();var p=pos(e);x.lineTo(p[0],p[1]);x.stroke()});
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){c.addEventListener(ev,function(){if(dib){dib=false;botones()}})});
  return {borrar:function(){x.save();x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.restore();usado=false},
    vacio:function(){return !usado},png:function(){return c.toDataURL('image/png').split(',')[1]}};
}

// ---- Enviar ----
function enviar(){
  if(ENVIANDO)return;
  var hora=R.horaExacta||(R.momento||'');
  var rel=R.relato||'';
  var forma=(R.forma||[]).concat(R.formaInc||[]);
  if(has(T_DAN)&&!has(T_ACC)&&!has(T_INC)&&R.danoBien)forma.push('Daño a: '+R.danoBien);
  var envio={tipos:R.tipos,fecha:fechaISO(),hora:hora,momento:R.momento||'',
    lugar:has(T_TRA)&&R.tipo===T_TRA?'Trayecto':(R.lugar||''),lugarDetalle:has(T_TRA)&&R.tipo===T_TRA?(R.trayectoLugar||''):(R.lugarDetalle||''),
    actividad:R.actividad||'',habitual:R.habitual||'',forma:forma,potencial:R.potencial||[],relato:rel,sugerencia:R.sugerencia||'',
    partes:(R.partes||[]).filter(function(p){return p!=='Ninguna'}),eva:R.eva===undefined?'':R.eva,tipoLesion:R.tipoLesion||'',
    urgente:R.urgente||'',atencion:R.atencion||'',motivoNegativa:R.motivoNegativa||'',
    trayectoSentido:R.trayectoSentido||'',trayectoOrigen:R.trayectoSentido?R.trayectoSentido.split(' → ')[0]:'',trayectoDestino:R.trayectoSentido?(R.trayectoSentido.split(' → ')[1]||''):'',
    trayectoMedio:R.trayectoMedio||'',trayectoPrueba:(R.trayectoPrueba||[]).join(', '),
    danoBien:R.danoBien||'',danoCodigo:R.danoCodigo||'',danoTerceros:R.danoTerceros||'',danoDesc:has(T_DAN)?rel:'',
    epSintomas:R.epSintomas||[],epDesde:R.epDesde||'',epTarea:R.epTarea||'',epAgente:(R.epAgente||[]).filter(function(a){return a!=='No sé'}),
    lkConducta:R.lkConducta||[],lkDenunciado:R.lkDenunciado||'',lkFrecuencia:R.lkFrecuencia||'',lkResguardoPide:R.lkResguardoPide||'',lkPsico:R.lkPsico||'',
    testigos:R.hayTestigos==='SI'?(R.testigos||[]).filter(function(t){return t.nombre.trim()}):[],
    fotos:R.fotos||[],firma:FIRMA.png()};
  ENVIANDO=true;botones();
  google.script.run.withSuccessHandler(function(r){ENVIANDO=false;R._id=r.id;PILA=[];ir('fin',true)})
    .withFailureHandler(function(e){ENVIANDO=false;botones();aviso(esc(e.message));if(/RUT|clave/.test(e.message)){PILA=[];ir('rut',true)}})
    .enviarReporte(R.k,envio,SES);
}
